spring:
  application:
    name: caramel-chat-backend
  # Loads the root .env (GOOGLE_API_KEY=...) when the backend is started from backend/.
  # Environment variables set in the shell take precedence over the file.
  config:
    import: optional:file:../.env[.properties]
  ai:
    google:
      genai:
        # Fails fast at startup if no key is available. The key is never logged or returned.
        api-key: ${GOOGLE_API_KEY}
        chat:
          # Gated by open item O1: confirm this model ID on the chosen route before live use.
          model: gemma-4-26b-a4b-it

server:
  # 8080 is often taken on developer machines (for example, Jenkins). Change here if needed.
  port: 8081

chat:
  max-message-length: 2000
  rate-limit-per-minute: 20
  allowed-origin: http://localhost:5173
  memory-window-size: 20
  provider-idle-timeout: 30s
